name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/smartphone-scientific-calculator-js8hzh, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the engine test suite
        run: node test/run.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages must be switched on once by hand (Settings ▸ Pages ▸ Source =
      # GitHub Actions). The Actions token is not permitted to create the site,
      # so `enablement: true` cannot do it for us.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # deploy-pages has queried the artifact API before the just-finalised
      # upload was visible there, failing the run with "0 artifacts found".
      # A short pause makes that race far less likely.
      - name: Let the uploaded artifact register
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
